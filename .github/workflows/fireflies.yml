# Builds data/fireflies.json: every iNaturalist firefly record (family Lampyridae) in the trail's iNaturalist project
# (appalachian-national-scenic-trail-huc10), filed under the firefly species checklist (181 species of the US and Canada,
# with recent synonyms), plus the records identified only to genus or family.
# Runs every Monday, or press "Run workflow" on the Actions tab. No secrets needed.
name: Fireflies

on:
  schedule:
    - cron: '17 9 * * 1'      # 09:17 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data/fireflies.json
        run: python scripts/build_fireflies.py
      - name: Commit if changed
        run: |
          git config user.name  "fireflies-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fireflies.json
          git diff --cached --quiet && exit 0
          git commit -m "Update firefly records"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
