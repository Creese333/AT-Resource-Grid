# Rebuilds place_names.json (USGS GNIS place names for the dashboard search) on its own.
# It also runs monthly inside the Historic resources workflow; this one is for a quick rebuild from the Actions tab.
name: Place names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build place_names.json
        run: python scripts/build_place_names.py
      - name: Commit if changed
        run: |
          git config user.name  "place-names-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/place_names.json
          git diff --cached --quiet && exit 0
          git commit -m "Update place names"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
