# Builds geology.json (A.T. corridor) and geology_huc10.json (HUC10 shell) for "What are the geologic resources here?":
# how well the geology is mapped (NPS GRI geologic map footprints, geologic_map_footprints.geojson in this repository) and what the
# bedrock is (USGS State Geologic Map Compilation, read from the USGS feature service or downloaded from ScienceBase).
# Runs on the 15th of January (the inputs change rarely), or press "Run workflow" on the Actions tab after updating the footprints.
name: Geology

on:
  schedule:
    - cron: '41 8 15 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install geopandas pyogrio shapely pyproj
      - name: Build geology.json
        run: python build_geology.py
      - name: Commit if changed
        run: |
          git config user.name  "geology-bot"
          git config user.email "actions@users.noreply.github.com"
          git add geology.json geology_huc10.json 2>/dev/null || git add geology.json
          git diff --cached --quiet && exit 0
          git commit -m "Update geology summaries"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
