# Checks the A.T. Resource Grid and publishes it only if every check passes.
# If a check fails, nothing is published and the last good version stays on grid.trailassessment.org;
# the failed run (Actions tab) lists what went wrong.
# Runs when anything is uploaded to main, after each data workflow finishes, and by hand.
# Data guard: every data file is compared with the last published version. A file that went missing, came out empty, or shrank
# by more than a fifth blocks publishing. If data got smaller on purpose, run this by hand and tick "Allow smaller data".
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Check and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_smaller:
        description: 'Allow smaller data (only when data was removed on purpose)'
        type: boolean
        default: false
  workflow_run:            # data workflows commit with the built-in token, which does not trigger "push"
    workflows: ["Bird profile photos", "Forest health risk", "Geology", "Historic resources", "iNaturalist, eBird and EDDMapS",
                "Phenology and forest pests", "Place names", "Topographic exposure", "Trail slope", "Weather",
                "Canopy loss", "Forest height and biomass", "Green-up and leaf-off", "Climate change since 1980",
                "Soundscape (NPS)", "Viewshed (3DEP)"]
    types: [completed]

permissions:
  contents: read
  actions: read            # to find the last published version
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Get the last published version, to compare the data with
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --workflow site.yml --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            git worktree add --detach /tmp/published "$sha" && echo "PREV=--prev /tmp/published" >> "$GITHUB_ENV"
            echo "Comparing with $sha"
          else
            echo "No published version found; the data comparison is skipped this time."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Check the site
        env:
          ALLOW_SMALLER: ${{ github.event.inputs.allow_smaller }}
        run: node scripts/site_check.js . 8790 $PREV
      - name: Gather the files the website serves
        run: |
          mkdir _site
          for f in index.html viewshed.html manifest.webmanifest sw.js CNAME data images; do [ -e "$f" ] && cp -r "$f" _site/; done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
