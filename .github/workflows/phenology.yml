# Pre-builds the iNaturalist records behind "When does it flower here?" and "Where are forest pests turning up?"
# (phen/index.json and one phen/<species>.json per species), so the dashboard loads them from the site instead of
# paging through the iNaturalist API in every visitor's browser. The dashboard still asks iNaturalist for anything newer.
# Runs every Monday, or press "Run workflow" on the Actions tab. No secrets needed.
name: Phenology and forest pests

on:
  schedule:
    - cron: '41 8 * * 1'      # 08:41 UTC every Monday
  workflow_dispatch:
    inputs:
      only:
        description: 'Only species whose key contains this text (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build phen/*.json
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: python build_phenology.py "$ONLY"
      - name: Commit if changed
        run: |
          git config user.name  "phenology-bot"
          git config user.email "actions@users.noreply.github.com"
          git add phen
          git diff --cached --quiet && exit 0
          git commit -m "Update phenology and forest pest records"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
