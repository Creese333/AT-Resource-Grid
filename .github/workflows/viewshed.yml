# Builds viewshed.json (A.T. corridor) and viewshed_huc10.json (HUC10 shell), plus one GeoJSON per overlook:
# what land can be seen from an overlook on the Trail, and so where a change on the ground would be seen from it.
# Press "Run workflow" on the Actions tab. Terrain rarely changes, so there is no schedule.
# Needs no secret: elevation comes from the public AWS Terrain Tiles (USGS 3DEP over the lower 48), which is why
# this works unattended here while the Earth Engine version in the notebook needs someone to sign in.
# To add an overlook, add it to POINTS in scripts/build_viewshed.py and run this again. The overlook is placed from the
# A.T. vista inventory by name; canopy comes from the Meta and WRI canopy height model, and if it cannot be read the run
# builds bare earth alone and says so in the log.
name: Viewshed (3DEP)

on:
  workflow_dispatch:
    inputs:
      radius_km:
        description: 'Analysis radius in km (16 km is about 10 miles)'
        required: false
        default: ''
      surfaces:
        description: 'Surfaces to build (bare, canopy)'
        required: false
        default: 'bare,canopy'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install geopandas pyogrio shapely pyproj rasterio numpy numba pillow requests
      - name: Build viewshed.json
        env:
          VS_RADIUS_KM: ${{ inputs.radius_km }}
          VS_SURFACES: ${{ inputs.surfaces }}
        run: python scripts/build_viewshed.py
      - name: Commit if changed
        run: |
          git config user.name  "viewshed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/viewshed.json data/viewshed_huc10.json data/viewshed_*.geojson 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update viewshed summaries"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
