# Rebuilds historic_resources.json and place_names.json for the A.T. Resource Grid on the 1st of every month,
# or whenever you press "Run workflow" on the Actions tab. Commits the file only when it changed.
name: Historic resources

on:
  schedule:
    - cron: '17 6 1 * *'     # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # about 3 GB of OpenStreetMap state extracts are downloaded and filtered for cemeteries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history, so the push step can catch up with newer commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install osmium-tool and shapely
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install shapely
      - name: Build historic_resources.json
        run: python scripts/build_historic_resources.py
      - name: Build place_names.json
        run: python scripts/build_place_names.py
        continue-on-error: true    # if the USGS names service is down, keep last month's file and still save the historic resources
      - name: Commit if changed
        run: |
          git config user.name  "historic-resources-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/historic_resources.json data/place_names.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Update historic resources"
          # if files were uploaded while the build ran, catch up with them first, then push (up to 3 tries)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
