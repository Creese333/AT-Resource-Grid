name: Historic resources
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build historic_resources.json
        run: python build_historic_resources.py
      - name: Commit if changed
        run: |
          git config user.name  "historic-resources-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historic_resources.json
          git diff --cached --quiet || (git commit -m "Update historic resources" && git push)
